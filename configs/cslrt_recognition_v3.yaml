model:
  num_frames: 32
  num_keypoints: 75
  d_model: 128
  nhead: 4
  num_encoder_layers: 3
  dropout: 0.15

data:
  keypoints_dir: data/isl/cslrt_keypoints
  splits_dir: data/isl/cslrt_splits
  batch_size: 16
  num_workers: 0
  scale_amount: 0.03
  noise_std: 0.003
  keypoint_mask_probability: 0.01
  frame_dropout_probability: 0.01

training:
  seed: 42
  epochs: 100
  lr: 0.0003
  weight_decay: 0.0005
  label_smoothing: 0.03
  patience: 20
  checkpoint_dir: models/cslrt_recognition_v3
