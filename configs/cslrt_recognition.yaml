model:
  num_frames: 32
  num_keypoints: 75
  d_model: 96
  nhead: 4
  num_encoder_layers: 2
  dropout: 0.35

data:
  keypoints_dir: data/isl/cslrt_keypoints
  splits_dir: data/isl/cslrt_splits
  batch_size: 16
  num_workers: 0
  scale_amount: 0.1
  noise_std: 0.01
  keypoint_mask_probability: 0.05
  frame_dropout_probability: 0.05

training:
  epochs: 100
  lr: 0.0002
  weight_decay: 0.002
  label_smoothing: 0.1
  patience: 20
  checkpoint_dir: models/cslrt_recognition_v2
